name: mac

on:
  workflow_dispatch:
    inputs:
      fftw_ref:
        description: OpenEphysFFTW branch, tag, or SHA to build against
        required: false
        default: float-batched-r2c
  push:
    branches:
      - main
    tags:
      - '*' # Runs on any tag push
  pull_request:
    branches:
      - main # Runs on pull requests targeting the main branch

env:
  # Restore this default to main after the prerequisite FFTW PR merges.
  OPENEPHYS_FFTW_REF: ${{ inputs.fftw_ref || 'float-batched-r2c' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  build-mac:

    runs-on: macos-26
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: setup
      run: |
        cd ../..
        git clone --depth 1 https://github.com/open-ephys/plugin-GUI.git --branch main
        cd plugin-GUI/Build && cmake -G "Xcode" -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" ..
        cd ../..
        mkdir OEPlugins && cd OEPlugins
        git clone --depth 1 https://github.com/open-ephys-plugins/OpenEphysFFTW.git --branch "$OPENEPHYS_FFTW_REF"
        cd OpenEphysFFTW/Build
        cmake -G "Xcode" -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" ..
        xcodebuild -target install -configuration Release
    - name: build
      run: |
        cd Build
        cmake -G "Xcode" -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DBUILD_TESTS=ON -DOPENEPHYS_FFTW_SOURCE_DIR=${{ github.workspace }}/../../OEPlugins/OpenEphysFFTW ..
        xcodebuild -configuration Release
    - name: test
      run: ctest --test-dir Build -C Release --output-on-failure
    - name: validate
      run: |
        binary=Build/Release/spectrum-viewer.bundle/Contents/MacOS/spectrum-viewer
        test -f "$binary"
        test "$(find Build/_deps/openblas/stage -name MANIFEST.txt | wc -l)" -eq 1
        archs=$(lipo -archs "$binary")
        echo "$archs" | grep -q x86_64
        echo "$archs" | grep -q arm64
        if nm -gU "$binary" | grep -Eiq 'openblas|lapacke|dstevr'; then
          echo "Spectrum Viewer exports private OpenBLAS symbols"
          exit 1
        fi
        if otool -L "$binary" | grep -Eiq 'openblas|lapack|gfortran|quadmath'; then
          echo "Spectrum Viewer has an unexpected numerical-library dependency"
          exit 1
        fi
    - name: package test artifact
      run: |
        mkdir -p ci-artifact/plugins
        cp -R Build/Release/spectrum-viewer.bundle ci-artifact/plugins/
        mkdir -p ci-artifact/plugins/spectrum-viewer.bundle/Contents/Resources
        cp THIRD_PARTY_NOTICES.md ci-artifact/plugins/spectrum-viewer.bundle/Contents/Resources/
    - name: upload test artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpectrumViewer-mac-${{ github.sha }}
        path: ci-artifact
        if-no-files-found: error
        retention-days: 14
    - name: codesign_deploy
      if: github.ref == 'refs/heads/main'
      env:
        ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
        MACOS_CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        MACOS_CERTIFICATE_PWD: ${{ secrets.BUILD_CERTIFICATE_PWD }}
        MACOS_CERTIFICATE_NAME: ${{ secrets.BUILD_CERTIFICATE_NAME }}
        MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
        PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
        PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
        PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
        build_dir: "Build/Release"
        package: SpectrumViewer-mac
      run: |
        plugin_api=$(grep -rnw ../../plugin-GUI/Source -e '#define PLUGIN_API_VER' | grep -Eo "[0-9]*" | tail -1)
        tag=$(grep -w Source/OpenEphysLib.cpp -e 'info->libVersion' | grep -Eo "[0-9]+.[0-9]+.[0-9]+")
        new_plugin_ver=$tag-API$plugin_api

        mkdir plugins 
        cp -r $build_dir/*.bundle plugins
        mkdir -p plugins/spectrum-viewer.bundle/Contents/Resources
        cp THIRD_PARTY_NOTICES.md plugins/spectrum-viewer.bundle/Contents/Resources/

        # Turn our base64-encoded certificate back to a regular .p12 file
        echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12

        # We need to create a new keychain, otherwise using the certificate will prompt
        # with a UI dialog asking for the certificate password, which we can't
        # use in a headless CI environment
        security create-keychain -p $MACOS_CI_KEYCHAIN_PWD build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p $MACOS_CI_KEYCHAIN_PWD build.keychain
        security import certificate.p12 -k build.keychain -P $MACOS_CERTIFICATE_PWD -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $MACOS_CI_KEYCHAIN_PWD build.keychain
        /usr/bin/codesign --force -s "$MACOS_CERTIFICATE_NAME" -v plugins/spectrum-viewer.bundle --deep --strict --timestamp --options=runtime

        /usr/bin/codesign -dv --verbose=4 plugins/spectrum-viewer.bundle

        # Store the notarization credentials so that we can prevent a UI password dialog from blocking the CI

        echo "Create keychain profile"
        xcrun notarytool store-credentials "notarytool-profile" --apple-id "$PROD_MACOS_NOTARIZATION_APPLE_ID" --team-id "$PROD_MACOS_NOTARIZATION_TEAM_ID" --password "$PROD_MACOS_NOTARIZATION_PWD"

        # We can't notarize an app bundle directly, but we need to compress it as an archive.
        # Therefore, we create a zip file containing our app bundle, so that we can send it to the
        # notarization service

        echo "Creating temp notarization archive"
        /usr/bin/ditto -c -k --sequesterRsrc --keepParent  plugins/spectrum-viewer.bundle spectrum-viewer.zip

        # Here we send the notarization request to the Apple's Notarization service, waiting for the result.
        # This typically takes a few seconds inside a CI environment, but it might take more depending on the App
        # characteristics. Visit the Notarization docs for more information and strategies on how to optimize it if
        # you're curious

        echo "Notarize app"
        xcrun notarytool submit "spectrum-viewer.zip" --keychain-profile "notarytool-profile" --wait

        # Finally, we need to "attach the staple" to our executable, which will allow our app to be
        # validated by macOS even when an internet connection is not available.
        echo "Attach staple"
        rm -r plugins/*
        /usr/bin/ditto -x -k spectrum-viewer.zip plugins
        xcrun stapler staple plugins/spectrum-viewer.bundle

        spctl -vvv --assess --type exec plugins/spectrum-viewer.bundle

        zipfile=${package}_${new_plugin_ver}.zip
        /usr/bin/ditto -c -k --sequesterRsrc --keepParent plugins $zipfile
        curl -H "X-JFrog-Art-Api:$ARTIFACTORY_ACCESS_TOKEN" -T $zipfile "https://openephys.jfrog.io/artifactory/SpectrumViewer-plugin/mac/$zipfile"
