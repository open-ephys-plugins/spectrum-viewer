name: Windows

on:
  push:
    branches:
      - '**' # Runs on push to any branch
    tags:
      - '*' # Runs on any tag push
  pull_request:
    branches:
      - main # Runs on pull requests targeting the main branch

jobs:

  build-windows:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: setup
      run: |
        cd ../..
        git clone https://github.com/open-ephys/plugin-GUI.git --branch main
        cd plugin-GUI/Build
        cmake -G "Visual Studio 17 2022" -A x64 .. 
        mkdir Release && cd Release
        curl -L https://openephys.jfrog.io/artifactory/GUI-binaries/Libraries/open-ephys-lib-v1.0.0.zip --output open-ephys-lib.zip 
        unzip open-ephys-lib.zip
      shell: bash
    - name: config-fftw
      run: |
        cd ../..
        mkdir OEPlugins && cd OEPlugins
        git clone https://github.com/open-ephys-plugins/OpenEphysFFTW.git --branch main
        cd OpenEphysFFTW/Build
        cmake -G "Visual Studio 17 2022" -A x64 ..
        cd ../..
        git clone https://github.com/open-ephys-plugins/OpenEphysNumerics.git --branch main
        cmake -S OpenEphysNumerics -B OpenEphysNumerics/Build -G "Visual Studio 17 2022" -A x64 -DGUI_BASE_DIR=${{ github.workspace }}/../../plugin-GUI
      shell: bash
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: build-fftw
      run: |
        msbuild ../../OEPlugins/OpenEphysFFTW/Build/INSTALL.vcxproj -p:Configuration=Release -p:Platform=x64
        cmake --build ../../OEPlugins/OpenEphysNumerics/Build --config Release --parallel 2
        cmake --install ../../OEPlugins/OpenEphysNumerics/Build --config Release
      shell: cmd
    - name: configure
      run: |
        cd Build
        cmake -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTS=ON -DOPENEPHYS_FFTW_SOURCE_DIR=${{ github.workspace }}/../../OEPlugins/OpenEphysFFTW -DOPENEPHYS_NUMERICS_SOURCE_DIR=${{ github.workspace }}/../../OEPlugins/OpenEphysNumerics .. 
      shell: bash
    - name: build
      run: |
        msbuild Build/INSTALL.vcxproj -p:Configuration=Release -p:Platform=x64
      shell: cmd
    - name: test
      run: |
        cmake --build Build --config Release --target spectrum_viewer_tests
        cp ../../plugin-GUI/Build/Release/shared/OpenEphysNumerics.dll Build/Release/
        ctest --test-dir Build -C Release --output-on-failure
      shell: bash
    - name: deploy
      if: github.ref == 'refs/heads/main'
      env:
        ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
        build_dir: "Build/Release"
        package: SpectrumViewer-windows
      run: |
        plugin_api=$(grep -rnw ../../plugin-GUI/Source -e '#define PLUGIN_API_VER' | grep -Eo "[0-9]*" | tail -1)
        tag=$(grep -w Source/OpenEphysLib.cpp -e 'info->libVersion' | grep -Eo "[0-9]+.[0-9]+.[0-9]+")
        new_plugin_ver=$tag-API$plugin_api
        mkdir plugins
        cp $build_dir/*.dll plugins
        zipfile=${package}_${new_plugin_ver}.zip
        powershell Compress-Archive -Path "plugins" -DestinationPath ${zipfile}
        curl -H "X-JFrog-Art-Api:$ARTIFACTORY_ACCESS_TOKEN" -T $zipfile "https://openephys.jfrog.io/artifactory/SpectrumViewer-plugin/windows/$zipfile"
      shell: bash
